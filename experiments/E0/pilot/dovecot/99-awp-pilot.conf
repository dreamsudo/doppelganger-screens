# File · experiments/E0/pilot/dovecot/99-awp-pilot.conf
# Purpose · Dovecot 2.4 drop-in for the mail-cell pilot: one virtual mail user for the lab's own IMAP server, Maildir storage, no system account involved.
# Description · Installed by the maintainer to /etc/dovecot/conf.d/ (a reserved action: system configuration). The user list lives outside the tree in /etc/dovecot/awp-users with a password generated on the maintainer's machine at install time; the tree never holds the credential. PAM stays configured but is never used by the pilot. Shaped by the measured default of 2026-10-18: Debian ships mail_driver = mbox over system users with PAM.
# Inputs/Outputs · In: /etc/dovecot/awp-users (user:{PLAIN}password:uid:gid::home). Out: IMAP on 127.0.0.1:143 for the pilot user with Maildir under /srv/awp-mail/<user>/Maildir.
# Depends on · dovecot-core, dovecot-imapd 2.4.5
# Invariant · Only loopback clients; cleartext auth is permitted only because the connection is local.
mail_driver = maildir
mail_path = %{home}/Maildir
# WHY, Measured: the shipped default mail_inbox_path = /var/mail/%{user} is an mbox path and made SELECT INBOX fail with an internal error under maildir; blank it so INBOX is the Maildir root
mail_inbox_path =
passdb passwd-file {
  passwd_file_path = /etc/dovecot/awp-users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/awp-users
}
auth_allow_cleartext = yes
